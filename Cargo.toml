[package]
name = "omni-director"
version = "0.1.5"
edition = "2021"

[dependencies]
# Core dependencies
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["macros", "rt", "rt-multi-thread", "fs"] }
thiserror = "2.0.12"
libloading = { version = "0.8.8" }
async-trait = "0.1.88"
anyhow = "1.0.98"
toml = "0.8.20"
whoami = "1.6.0"

# Web framework dependencies
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
env_logger = "0.10"

[dev-dependencies]
axum-test = "15.0"

# Local dependencies (only keep what's needed)
omni-feature-traits = { path = "../shared/feature-traits" }

[profile.dev]
codegen-units = 32
incremental = true
debug-assertions = false
overflow-checks = false
opt-level = 0
lto = "thin"
